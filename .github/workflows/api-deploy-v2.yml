name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'infra/api.bicep'
      - '.github/workflows/api-deploy-v2.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'

permissions:
  contents: read
  packages: write

env:
  AZURE_RESOURCE_GROUP: rg-mume
  AZURE_REGION: eastus

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR credentials
        id: acr
        run: |
          ACR_NAME=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name main \
            --query 'properties.outputs.containerRegistryName.value' \
            --output tsv)
          
          ACR_SERVER=$(az acr show --name $ACR_NAME --query loginServer --output tsv)
          ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query 'passwords[0].value' --output tsv)
          
          echo "acr-name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acr-server=$ACR_SERVER" >> $GITHUB_OUTPUT
          echo "acr-username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr-password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.acr-server }}
          username: ${{ steps.acr.outputs.acr-username }}
          password: ${{ steps.acr.outputs.acr-password }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr.outputs.acr-server }}/mume-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'dev' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name main \
            --query 'properties.outputs' \
            --output json)
          
          ACR_SERVER=$(echo "$OUTPUTS" | jq -r '.containerRegistryLoginServer.value')
          ACR_NAME=$(echo "$OUTPUTS" | jq -r '.containerRegistryName.value')
          CONTAINER_ENV_ID=$(echo "$OUTPUTS" | jq -r '.containerEnvId.value')
          REDIS_HOST=$(echo "$OUTPUTS" | jq -r '.redisHostName.value')
          STATIC_WEB_APP=$(echo "$OUTPUTS" | jq -r '.staticWebAppDefaultHostname.value')
          
          ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query 'passwords[0].value' --output tsv)
          
          echo "acr-server=$ACR_SERVER" >> $GITHUB_OUTPUT
          echo "acr-username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr-password=$ACR_PASSWORD" >> $GITHUB_OUTPUT
          echo "container-env-id=$CONTAINER_ENV_ID" >> $GITHUB_OUTPUT
          echo "redis-hostname=$REDIS_HOST" >> $GITHUB_OUTPUT
          echo "frontend-url=https://$STATIC_WEB_APP" >> $GITHUB_OUTPUT

      - name: Deploy Container App
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/api.bicep \
            --parameters location=${{ env.AZURE_REGION }} \
            --parameters environment=dev \
            --parameters containerEnvironmentId="${{ steps.infra.outputs.container-env-id }}" \
            --parameters containerRegistryServer="${{ steps.infra.outputs.acr-server }}" \
            --parameters containerRegistryUsername="${{ steps.infra.outputs.acr-username }}" \
            --parameters containerRegistryPassword="${{ steps.infra.outputs.acr-password }}" \
            --parameters imageTag="${{ needs.build.outputs.image-tag }}" \
            --parameters redisHostName="${{ steps.infra.outputs.redis-hostname }}" \
            --parameters sessionSecret="${{ secrets.SESSION_SECRET }}" \
            --parameters tokenEncryptionKey="${{ secrets.TOKEN_ENCRYPTION_KEY }}" \
            --parameters githubClientId="${{ secrets.GITHUB_CLIENT_ID }}" \
            --parameters githubClientSecret="${{ secrets.GITHUB_CLIENT_SECRET }}" \
            --parameters frontendUrl="${{ steps.infra.outputs.frontend-url }}"

      - name: Get API URL
        id: api
        run: |
          API_FQDN=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name mume-api-dev \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          echo "fqdn=$API_FQDN" >> $GITHUB_OUTPUT
          echo "✅ API deployed to: https://$API_FQDN"

      - name: Wait for health check
        run: |
          echo "Waiting 30 seconds for container to start..."
          sleep 30
          
          echo "Testing health endpoint..."
          curl -s https://${{ steps.api.outputs.fqdn }}/health || echo "Health check pending..."

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'prod'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name main \
            --query 'properties.outputs' \
            --output json)
          
          ACR_SERVER=$(echo "$OUTPUTS" | jq -r '.containerRegistryLoginServer.value')
          ACR_NAME=$(echo "$OUTPUTS" | jq -r '.containerRegistryName.value')
          CONTAINER_ENV_ID=$(echo "$OUTPUTS" | jq -r '.containerEnvId.value')
          REDIS_HOST=$(echo "$OUTPUTS" | jq -r '.redisHostName.value')
          STATIC_WEB_APP=$(echo "$OUTPUTS" | jq -r '.staticWebAppDefaultHostname.value')
          
          ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query 'passwords[0].value' --output tsv)
          
          echo "acr-server=$ACR_SERVER" >> $GITHUB_OUTPUT
          echo "acr-username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr-password=$ACR_PASSWORD" >> $GITHUB_OUTPUT
          echo "container-env-id=$CONTAINER_ENV_ID" >> $GITHUB_OUTPUT
          echo "redis-hostname=$REDIS_HOST" >> $GITHUB_OUTPUT
          echo "frontend-url=https://$STATIC_WEB_APP" >> $GITHUB_OUTPUT

      - name: Deploy Container App
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/api.bicep \
            --parameters location=${{ env.AZURE_REGION }} \
            --parameters environment=prod \
            --parameters containerEnvironmentId="${{ steps.infra.outputs.container-env-id }}" \
            --parameters containerRegistryServer="${{ steps.infra.outputs.acr-server }}" \
            --parameters containerRegistryUsername="${{ steps.infra.outputs.acr-username }}" \
            --parameters containerRegistryPassword="${{ steps.infra.outputs.acr-password }}" \
            --parameters imageTag="${{ needs.build.outputs.image-tag }}" \
            --parameters redisHostName="${{ steps.infra.outputs.redis-hostname }}" \
            --parameters sessionSecret="${{ secrets.SESSION_SECRET }}" \
            --parameters tokenEncryptionKey="${{ secrets.TOKEN_ENCRYPTION_KEY }}" \
            --parameters githubClientId="${{ secrets.GITHUB_CLIENT_ID }}" \
            --parameters githubClientSecret="${{ secrets.GITHUB_CLIENT_SECRET }}" \
            --parameters frontendUrl="${{ steps.infra.outputs.frontend-url }}"

      - name: Get API URL
        id: api
        run: |
          API_FQDN=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name mume-api \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          echo "fqdn=$API_FQDN" >> $GITHUB_OUTPUT
          echo "✅ API deployed to PRODUCTION: https://$API_FQDN"

      - name: Verify health check
        run: |
          echo "Waiting 30 seconds for container to start..."
          sleep 30
          
          echo "Testing health endpoint..."
          curl -s https://${{ steps.api.outputs.fqdn }}/health | jq

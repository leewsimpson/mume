name: Deploy Base Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy-v2.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-mume
  AZURE_REGION: eastus

jobs:
  validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/main.bicep
          az deployment group validate \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters location=${{ env.AZURE_REGION }} \
            --parameters environment=${{ github.event.inputs.environment || 'dev' }} \
            --parameters sessionSecret=${{ secrets.SESSION_SECRET }} \
            --parameters tokenEncryptionKey=${{ secrets.TOKEN_ENCRYPTION_KEY }} \
            --parameters githubClientId=${{ secrets.GITHUB_CLIENT_ID }} \
            --parameters githubClientSecret=${{ secrets.GITHUB_CLIENT_SECRET }}

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.environment == 'dev' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy base infrastructure
        id: deploy
        run: |
          OUTPUT=$(az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters location=${{ env.AZURE_REGION }} \
            --parameters environment=dev \
            --parameters sessionSecret=${{ secrets.SESSION_SECRET }} \
            --parameters tokenEncryptionKey=${{ secrets.TOKEN_ENCRYPTION_KEY }} \
            --parameters githubClientId=${{ secrets.GITHUB_CLIENT_ID }} \
            --parameters githubClientSecret=${{ secrets.GITHUB_CLIENT_SECRET }} \
            --output json)
          
          echo "$OUTPUT" | jq -r '.properties.outputs | to_entries[] | "\(.key)=\(.value.value)"' >> $GITHUB_OUTPUT

      - name: Display deployment outputs
        run: |
          echo "✅ Infrastructure deployed successfully!"
          echo ""
          echo "Container Registry: ${{ steps.deploy.outputs.containerRegistryName }}"
          echo "Container Environment: ${{ steps.deploy.outputs.containerEnvName }}"
          echo "Redis Host: ${{ steps.deploy.outputs.redisHostName }}"
          echo "Static Web App: ${{ steps.deploy.outputs.staticWebAppDefaultHostname }}"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.environment == 'prod'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy base infrastructure
        id: deploy
        run: |
          OUTPUT=$(az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters location=${{ env.AZURE_REGION }} \
            --parameters environment=prod \
            --parameters sessionSecret=${{ secrets.SESSION_SECRET }} \
            --parameters tokenEncryptionKey=${{ secrets.TOKEN_ENCRYPTION_KEY }} \
            --parameters githubClientId=${{ secrets.GITHUB_CLIENT_ID }} \
            --parameters githubClientSecret=${{ secrets.GITHUB_CLIENT_SECRET }} \
            --output json)
          
          echo "$OUTPUT" | jq -r '.properties.outputs | to_entries[] | "\(.key)=\(.value.value)"' >> $GITHUB_OUTPUT

      - name: Display deployment outputs
        run: |
          echo "✅ Infrastructure deployed to PRODUCTION successfully!"
          echo ""
          echo "Container Registry: ${{ steps.deploy.outputs.containerRegistryName }}"
          echo "Container Environment: ${{ steps.deploy.outputs.containerEnvName }}"
          echo "Redis Host: ${{ steps.deploy.outputs.redisHostName }}"
          echo "Static Web App: ${{ steps.deploy.outputs.staticWebAppDefaultHostname }}"

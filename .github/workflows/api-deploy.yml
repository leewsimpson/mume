name: Build API Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: mumeacr2gdrwkfmswho2.azurecr.io

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          IMAGE_TAG="main-${SHORT_SHA}-${TIMESTAMP}"
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/mume-api:${{ steps.tag.outputs.image-tag }}
            ${{ env.ACR_LOGIN_SERVER }}/mume-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment instructions
        run: |
          echo "✅ Docker image pushed successfully!"
          echo ""
          echo "📦 Image: ${{ env.ACR_LOGIN_SERVER }}/mume-api:${{ steps.tag.outputs.image-tag }}"
          echo ""
          echo "To deploy this image to Container Apps, run:"
          echo ""
          echo "az containerapp update \\"
          echo "  --name mume-api-dev \\"
          echo "  --resource-group rg-mume \\"
          echo "  --image ${{ env.ACR_LOGIN_SERVER }}/mume-api:${{ steps.tag.outputs.image-tag }}"
          echo ""
          echo "Or use the :latest tag:"
          echo ""
          echo "az containerapp update \\"
          echo "  --name mume-api-dev \\"
          echo "  --resource-group rg-mume \\"
          echo "  --image ${{ env.ACR_LOGIN_SERVER }}/mume-api:latest"

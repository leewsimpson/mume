name: API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: mumeacr2gdrwkfmswho2.azurecr.io

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          IMAGE_TAG="main-${SHORT_SHA}-${TIMESTAMP}"
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/mume-api:${{ steps.tag.outputs.image-tag }}
            ${{ env.ACR_LOGIN_SERVER }}/mume-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Container App
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name mume-api-dev \
            --resource-group rg-mume \
            --image ${{ env.ACR_LOGIN_SERVER }}/mume-api:latest

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to stabilise..."
          sleep 10
          REVISION=$(az containerapp revision list \
            --name mume-api-dev \
            --resource-group rg-mume \
            --query "[0].name" -o tsv)
          STATE=$(az containerapp revision show \
            --name mume-api-dev \
            --resource-group rg-mume \
            --revision $REVISION \
            --query "properties.runningState" -o tsv)
          echo "Latest revision: $REVISION"
          echo "Running state: $STATE"
          if [ "$STATE" != "Running" ]; then
            echo "Warning: Revision is not in Running state"
            exit 1
          fi
          echo "Deployment successful!"

# NOTE: The deploy job requires an AZURE_CREDENTIALS secret.
# To create this secret, run:
#
#   az ad sp create-for-rbac --name "mume-github-actions" \
#     --role contributor \
#     --scopes /subscriptions/a8c56054-d1fc-4874-8d04-29f2b3f8d937/resourceGroups/rg-mume \
#     --sdk-auth
#
# Then add the JSON output as a GitHub secret named AZURE_CREDENTIALS:
#   gh secret set AZURE_CREDENTIALS < credentials.json

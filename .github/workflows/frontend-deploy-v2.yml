name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-deploy-v2.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'

permissions:
  contents: read
  pull-requests: write

env:
  AZURE_RESOURCE_GROUP: rg-mume

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'dev' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get API URL
        id: api
        run: |
          API_FQDN=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name mume-api-dev \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          echo "url=https://$API_FQDN" >> $GITHUB_OUTPUT
          echo "✅ API URL: https://$API_FQDN"

      - name: Build and Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/apps/frontend'
          output_location: 'dist'
          skip_api_build: true
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}

      - name: Get Frontend URL
        run: |
          FRONTEND_URL=$(az staticwebapp show \
            --name mume-frontend-dev \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query defaultHostname \
            --output tsv)
          
          echo "✅ Frontend deployed to: https://$FRONTEND_URL"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'prod'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get API URL
        id: api
        run: |
          API_FQDN=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name mume-api \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          echo "url=https://$API_FQDN" >> $GITHUB_OUTPUT
          echo "✅ API URL: https://$API_FQDN"

      - name: Build and Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/apps/frontend'
          output_location: 'dist'
          skip_api_build: true
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}

      - name: Get Frontend URL
        run: |
          FRONTEND_URL=$(az staticwebapp show \
            --name mume-frontend \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query defaultHostname \
            --output tsv)
          
          echo "✅ Frontend deployed to PRODUCTION: https://$FRONTEND_URL"

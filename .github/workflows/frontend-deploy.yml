name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-mume

jobs:
  build-and-deploy-dev:
    name: Build and Deploy to Dev
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'dev' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name main \
            --query 'properties.outputs' \
            --output json)
          
          STATIC_WEB_APP_NAME=$(echo "$OUTPUTS" | jq -r '.staticWebAppName.value')
          
          # Get the API URL
          API_FQDN=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name mume-api-dev \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          echo "static-web-app-name=$STATIC_WEB_APP_NAME" >> $GITHUB_OUTPUT
          echo "api-url=https://$API_FQDN" >> $GITHUB_OUTPUT

      - name: Get Static Web App deployment token
        id: swa
        run: |
          API_KEY=$(az staticwebapp secrets list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ steps.infra.outputs.static-web-app-name }} \
            --query properties.apiKey \
            --output tsv)
          
          echo "api-key=$API_KEY" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        env:
          VITE_API_URL: ${{ steps.infra.outputs.api-url }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api-key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'apps/frontend'
          output_location: 'dist'
          skip_app_build: true

      - name: Display deployment URL
        run: |
          HOSTNAME=$(az staticwebapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ steps.infra.outputs.static-web-app-name }} \
            --query defaultHostname \
            --output tsv)
          
          echo "Frontend deployed to: https://$HOSTNAME"

  build-and-deploy-prod:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'prod'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name main \
            --query 'properties.outputs' \
            --output json)
          
          STATIC_WEB_APP_NAME=$(echo "$OUTPUTS" | jq -r '.staticWebAppName.value')
          
          # Get the API URL
          API_FQDN=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name mume-api \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          echo "static-web-app-name=$STATIC_WEB_APP_NAME" >> $GITHUB_OUTPUT
          echo "api-url=https://$API_FQDN" >> $GITHUB_OUTPUT

      - name: Get Static Web App deployment token
        id: swa
        run: |
          API_KEY=$(az staticwebapp secrets list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ steps.infra.outputs.static-web-app-name }} \
            --query properties.apiKey \
            --output tsv)
          
          echo "api-key=$API_KEY" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        env:
          VITE_API_URL: ${{ steps.infra.outputs.api-url }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api-key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'apps/frontend'
          output_location: 'dist'
          skip_app_build: true

      - name: Display deployment URL
        run: |
          HOSTNAME=$(az staticwebapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ steps.infra.outputs.static-web-app-name }} \
            --query defaultHostname \
            --output tsv)
          
          echo "Frontend deployed to: https://$HOSTNAME"

name: Deploy Frontend (No Service Principal)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-deploy-simple.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'dev' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/apps/frontend'
          output_location: 'dist'
          skip_api_build: true
        env:
          # API URL will be injected at build time
          VITE_API_URL: https://mume-api-dev.delightfulground-f44c4ea7.eastus.azurecontainerapps.io

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed to: https://green-bush-0747a000f.2.azurestaticapps.net"
          echo "🔗 API endpoint: https://mume-api-dev.delightfulground-f44c4ea7.eastus.azurecontainerapps.io"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'prod'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set production API URL
        id: api
        run: |
          # Hardcoded for now - update when production API is deployed
          echo "api-url=https://mume-api-dev.delightfulground-f44c4ea7.eastus.azurecontainerapps.io" >> $GITHUB_OUTPUT
          echo "🔗 Using API: https://mume-api-dev.delightfulground-f44c4ea7.eastus.azurecontainerapps.io"

      - name: Build and Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/apps/frontend'
          output_location: 'dist'
          skip_api_build: true
        env:
          VITE_API_URL: ${{ steps.api.outputs.api-url }}

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed to PRODUCTION"
          echo "🔗 API endpoint: ${{ steps.api.outputs.api-url }}"
